# Publish Sucoban to GitHub Pages on every push to main.
# Live at https://mrjazzman.github.io/Cuco-s-Sokoban-Edition/
# and, once the custom domain is set up (see README), https://sucoban.miguelg.dev
#
# The deploy only runs if every level passes verify.js.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify every level is well-formed and solvable
        run: node verify.js

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html style.css favicon.svg \
             config.js i18n.js progress.js account.js levels.js music.js game.js _site/
          cp -r assets _site/
          ls -la _site _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
