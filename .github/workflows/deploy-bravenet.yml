# Deploy static game files to Bravenet via SFTP on every push to main.
# Public URL: https://beiradagua.info/gukoban/
#
# Secrets required (GitHub → Settings → Secrets and variables → Actions):
#   SFTP_SERVER       SFTP host, e.g. ftp3.bravehost.com
#   SFTP_SERVER_PORT  22
#   SFTP_USERNAME     full username including number suffix
#   SFTP_PASSWORD     SFTP password
#   SFTP_PATH         not used for the remoteDir — kept for reference only

name: Deploy to Bravenet

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bravenet
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage files to upload
        run: |
          mkdir -p dist
          cp index.html style.css game.js levels.js music.js .htaccess dist/
          ls -la dist

      - name: Upload to Bravenet (SFTP)
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          port: ${{ secrets.SFTP_SERVER_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          localDir: dist/
          remoteDir: gukoban/
          forceUpload: true
